version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: skin-market-db
    environment:
      POSTGRES_DB: skin_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: skin-market-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
